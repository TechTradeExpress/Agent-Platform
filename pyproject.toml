[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-platform"
version = "0.1.0"
description = "Repository inspection and explicit, safe task preparation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "cryptography>=43.0.0,<51",
]

[project.scripts]
agent-platform = "agent_platform.cli:main"
agent-platform-broker = "agent_platform.broker:main"
agent-platform-native-canary = "agent_platform.native_canary:main"
agent-platform-native-artifact = "agent_platform.native_artifact:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

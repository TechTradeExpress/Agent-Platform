name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.6'
      - run: uv sync --locked --python /usr/bin/python3.12 --no-managed-python --no-python-downloads
      - run: uv run --no-sync --python /usr/bin/python3.12 --no-managed-python --no-python-downloads ruff check .
      - run: uv run --no-sync --python /usr/bin/python3.12 --no-managed-python --no-python-downloads python ci/cp08_pytest.py
      - run: git diff --check

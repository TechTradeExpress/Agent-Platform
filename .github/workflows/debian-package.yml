name: Debian package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build isolated tool and dependency images
        run: |
          docker build --platform linux/amd64 --target quality -t ap-package-quality -f packaging/debian/Dockerfile packaging/debian
          docker build --platform linux/amd64 --target lifecycle -t ap-package-lifecycle -f packaging/debian/Dockerfile packaging/debian
      - name: Build real N and N+1 packages and compare candidate rebuild
        run: |
          mkdir -p "$RUNNER_TEMP/ap-packages" "$RUNNER_TEMP/ap-evidence"
          source_sha=$(git rev-parse HEAD)
          docker run --rm --platform linux/amd64 --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/build_deb.py --source-commit "$source_sha" --synthetic-fixture --revision 3 --output /packages/n
          docker run --rm --platform linux/amd64 --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/build_deb.py --source-commit "$source_sha" --synthetic-fixture --revision 4 --output /packages/next
          docker run --rm --platform linux/amd64 --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/build_deb.py --source-commit "$source_sha" --synthetic-fixture --revision 4 --output /packages/rebuilt
          for role in control worker; do
            cmp "$RUNNER_TEMP/ap-packages/next/agent-platform-${role}_0.1.0-4_amd64.deb" "$RUNNER_TEMP/ap-packages/rebuilt/agent-platform-${role}_0.1.0-4_amd64.deb"
          done
          docker run --rm --platform linux/amd64 --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/debian/build_legacy_fixtures.py /packages/historical
          mv "$RUNNER_TEMP/ap-packages/historical/legacy-1" "$RUNNER_TEMP/ap-packages/legacy-1"
          mv "$RUNNER_TEMP/ap-packages/historical/legacy-2" "$RUNNER_TEMP/ap-packages/legacy-2"
          cat "$RUNNER_TEMP/ap-packages/n/SHA256SUMS" "$RUNNER_TEMP/ap-packages/next/SHA256SUMS"
          docker run --rm --platform linux/amd64 --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/build_deb.py --source-commit "$source_sha" --synthetic-fixture --revision 5 --output /packages/p1
          docker run --rm --platform linux/amd64 --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/build_deb.py --source-commit "$source_sha" --synthetic-fixture --revision 6 --output /packages/p1-next
          docker run --rm --platform linux/amd64 --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/build_deb.py --source-commit "$source_sha" --synthetic-fixture --revision 6 --output /packages/p1-rebuilt
          for role in control worker; do
            cmp "$RUNNER_TEMP/ap-packages/p1-next/agent-platform-${role}_0.1.0-6_amd64.deb" "$RUNNER_TEMP/ap-packages/p1-rebuilt/agent-platform-${role}_0.1.0-6_amd64.deb"
          done
      - name: PKG-11 pinned historical -7 and uniquely named -8 candidates
        run: |
          source_sha=$(git rev-parse HEAD)
          docker run --rm --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/debian/build_worker_baseline.py --output /packages/worker01-baseline
          test -s "$RUNNER_TEMP/ap-packages/worker01-baseline/baseline-verification.json"
          # -7 uses only the verified immutable pre-HAR source and its original recipe.
          docker run --rm --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/debian/build_pkg11_baseline.py --output /packages/historical-7
          test -s "$RUNNER_TEMP/ap-packages/historical-7/baseline-verification.json"
          docker run --rm --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/build_deb.py --source-commit "$source_sha" --output /packages/pkg11-candidate
          docker run --rm --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/build_deb.py --source-commit "$source_sha" --output /packages/pkg11-rebuilt
          for role in control worker; do
            cmp "$RUNNER_TEMP/ap-packages/pkg11-candidate/agent-platform-${role}_0.1.0-8~git${source_sha}_amd64.deb" "$RUNNER_TEMP/ap-packages/pkg11-rebuilt/agent-platform-${role}_0.1.0-8~git${source_sha}_amd64.deb"
          done
          # Exact -8 compatibility fixture: CI_ONLY / NOT_RELEASED, never a release.
          docker run --rm --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/build_deb.py --source-commit "$source_sha" --ci-final-fixture --output /packages/pkg11-upgrade-test
      - name: Real worker01 historical -6 to -7 offline upgrade
        run: |
          docker build --target worker-upgrade -t ap-worker-upgrade -f packaging/debian/Dockerfile packaging/debian
          upgrade_failed=0
          for journal_case in empty unknown; do
            if ! docker run --rm --network none --security-opt no-new-privileges --pids-limit 256 --memory 2g --cpus 2 -v "$RUNNER_TEMP/ap-packages:/packages:ro" -v "$RUNNER_TEMP/ap-evidence:/evidence" ap-worker-upgrade "$journal_case"; then
              upgrade_failed=1
            fi
            if ! test -s "$RUNNER_TEMP/ap-evidence/pkg09-upgrade-$journal_case.json"; then
              upgrade_failed=1
            fi
          done
          test "$upgrade_failed" -eq 0
      - name: PKG-11 real historical -7 to -8 offline upgrade
        run: |
          upgrade_failed=0
          for journal_case in empty unknown; do
            if ! docker run --rm --network none --security-opt no-new-privileges --pids-limit 256 --memory 2g --cpus 2 -v "$RUNNER_TEMP/ap-packages:/packages:ro" -v "$RUNNER_TEMP/ap-evidence:/evidence" ap-worker-upgrade "$journal_case" pkg11; then
              upgrade_failed=1
            fi
            if ! test -s "$RUNNER_TEMP/ap-evidence/pkg11-upgrade-$journal_case.json"; then
              upgrade_failed=1
            fi
          done
          test "$upgrade_failed" -eq 0
      - name: Real apt and dpkg lifecycle with no network or host state
        run: |
          docker run --rm --platform linux/amd64 --network none --security-opt no-new-privileges --pids-limit 256 --memory 2g --cpus 2 -v "$RUNNER_TEMP/ap-packages:/packages:ro" -v "$RUNNER_TEMP/ap-evidence:/evidence" ap-package-lifecycle
          test -s "$RUNNER_TEMP/ap-evidence/lifecycle.json"
      - name: Multi-UID P1 provisioning and lifecycle, no live credentials
        run: |
          p1_failed=0
          for p1_case in clean existing; do
            if ! docker build --platform linux/amd64 --target worker-p1 --build-arg P1_CASE="$p1_case" -t "ap-package-worker-p1-$p1_case" -f packaging/debian/Dockerfile packaging/debian; then
              p1_failed=1
              continue
            fi
            if ! docker run --rm --platform linux/amd64 --network none --security-opt no-new-privileges --pids-limit 256 --memory 2g --cpus 2 -v "$RUNNER_TEMP/ap-packages:/packages:ro" -v "$RUNNER_TEMP/ap-evidence:/evidence" "ap-package-worker-p1-$p1_case"; then
              p1_failed=1
            fi
            if ! test -s "$RUNNER_TEMP/ap-evidence/worker-p1-lifecycle-$p1_case.json"; then
              p1_failed=1
            fi
          done
          test "$p1_failed" -eq 0
      - name: Separate synthetic Codex installer lifecycle, offline and rollback
        if: ${{ !cancelled() }}
        run: |
          docker build --platform linux/amd64 --target codex-pkg05 -t ap-codex-pkg05 -f packaging/debian/Dockerfile packaging/debian
          docker run --rm --platform linux/amd64 --network none --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-evidence:/evidence" ap-codex-pkg05
          test -s "$RUNNER_TEMP/ap-evidence/codex-pkg05-lifecycle.json"
      - name: Prior slim manpage 0775 remains BLOCKED
        if: ${{ !cancelled() }}
        run: |
          docker build --platform linux/amd64 --target manpage-negative -t ap-manpage-negative -f packaging/debian/Dockerfile packaging/debian
          docker run --rm --platform linux/amd64 --network none --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-evidence:/evidence" ap-manpage-negative
          test -s "$RUNNER_TEMP/ap-evidence/prior-slim-manpage-negative.json"
      - name: Inspect archives, lintian and autopkgtest in separate container
        if: always()
        run: |
          docker run --rm --platform linux/amd64 --network none --security-opt no-new-privileges --pids-limit 256 --memory 2g -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages:ro" -v "$RUNNER_TEMP/ap-evidence:/evidence" -w /source ap-package-quality /bin/sh /opt/ap-tests/quality.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: debian-candidates-and-lifecycle-evidence
          path: |
            ${{ runner.temp }}/ap-packages
            ${{ runner.temp }}/ap-evidence
          if-no-files-found: error
          retention-days: 14

name: Debian package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build isolated tool and dependency images
        run: |
          docker build --platform linux/amd64 --target quality -t ap-package-quality -f packaging/debian/Dockerfile packaging/debian
          docker build --platform linux/amd64 --target lifecycle -t ap-package-lifecycle -f packaging/debian/Dockerfile packaging/debian
      - name: Build real N and N+1 packages and compare candidate rebuild
        run: |
          mkdir -p "$RUNNER_TEMP/ap-packages" "$RUNNER_TEMP/ap-evidence"
          docker run --rm --platform linux/amd64 --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/build_deb.py --revision 1 --output /packages/n
          docker run --rm --platform linux/amd64 --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/build_deb.py --revision 2 --output /packages/next
          docker run --rm --platform linux/amd64 --network none --read-only --tmpfs /tmp --user "$(id -u):$(id -g)" -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages" -w /source ap-package-quality python3 packaging/build_deb.py --revision 2 --output /packages/rebuilt
          cmp "$RUNNER_TEMP/ap-packages/next/agent-platform_0.1.0-2_amd64.deb" "$RUNNER_TEMP/ap-packages/rebuilt/agent-platform_0.1.0-2_amd64.deb"
          cat "$RUNNER_TEMP/ap-packages/n/SHA256SUMS" "$RUNNER_TEMP/ap-packages/next/SHA256SUMS"
      - name: Real apt and dpkg lifecycle with no network or host state
        run: |
          docker run --rm --platform linux/amd64 --network none --security-opt no-new-privileges --pids-limit 256 --memory 2g --cpus 2 -v "$RUNNER_TEMP/ap-packages:/packages:ro" -v "$RUNNER_TEMP/ap-evidence:/evidence" ap-package-lifecycle
          test -s "$RUNNER_TEMP/ap-evidence/lifecycle.json"
      - name: Inspect archives, lintian and autopkgtest in separate container
        if: always()
        run: |
          docker run --rm --platform linux/amd64 --network none --security-opt no-new-privileges --pids-limit 256 --memory 2g -v "$PWD:/source:ro" -v "$RUNNER_TEMP/ap-packages:/packages:ro" -v "$RUNNER_TEMP/ap-evidence:/evidence" -w /source ap-package-quality sh -ec '
            dpkg-deb --info /packages/next/*.deb > /evidence/package-info.txt
            dpkg-deb --contents /packages/next/*.deb > /evidence/package-files.txt
            test "$(dpkg-deb -f /packages/next/*.deb Architecture)" = amd64
            test "$(dpkg-deb -f /packages/next/*.deb Version)" = 0.1.0-2
            test "$(dpkg-deb -f /packages/next/*.deb Depends)" = "python3 (>= 3.12), git, gh"
            dpkg-deb --control /packages/next/*.deb /tmp/ap-control
            for hook in preinst postinst prerm postrm triggers; do test ! -e "/tmp/ap-control/$hook"; done
            lintian --allow-root --fail-on error /packages/n/*.deb /packages/next/*.deb > /evidence/lintian.txt 2>&1
            apt-get -y install /packages/next/*.deb
            autopkgtest --no-built-binaries -o /evidence/autopkgtest /packages/next/agent-platform_0.1.0-2_amd64.deb /source -- null
            test -s /evidence/autopkgtest/summary
            grep -Eq "smoke[[:space:]]+PASS" /evidence/autopkgtest/summary
            dpkg-query -W > /evidence/quality-toolchain.txt
            chmod -R a+rX /evidence
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: debian-candidates-and-lifecycle-evidence
          path: |
            ${{ runner.temp }}/ap-packages
            ${{ runner.temp }}/ap-evidence
          if-no-files-found: error
          retention-days: 14
